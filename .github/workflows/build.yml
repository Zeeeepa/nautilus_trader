  build-windows:
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-2022
        python-version:
          - "3.11"
          - "3.12"
          - "3.13.2" # pinned to 3.13.2, see https://github.com/nautechsystems/nautilus_trader/blob/develop/docs/getting_started/installation.md
    defaults:
      run:
        shell: bash
    name: build - python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Pause job on develop branch for now (takes ~1 hr)
    # TODO: Pause on nightly branch to investigate new build failures
    if: >
      !( (github.event_name == 'push' && (github.ref_name == 'develop' || github.ref_name == 'nightly'))
      || (github.event_name == 'pull_request' && github.base_ref == 'develop') )
    # needs:
    #   - pre-commit
    env:
      BUILD_MODE: release
      HIGH_PRECISION: false
      PARALLEL_BUILD: false
      RUST_BACKTRACE: 1
    steps:
      # https://github.com/step-security/harden-runner
      - uses: step-security/harden-runner@6c439dc8bdf85cadbbce9ed30d1c7b959517bc49 # v2.12.2
        with:
          egress-policy: audit

      - name: Checkout repository
        # https://github.com/actions/checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Common setup
        uses: ./.github/actions/common-setup
        with:
          python-version: ${{ matrix.python-version }}
          free-disk-space: "true"

      - name: Build and install wheel
        uses: ./.github/actions/common-wheel-build
        with:
          python-version: ${{ matrix.python-version }}
          github_ref: ${{ github.ref }}

      - name: Cached test data
        uses: ./.github/actions/common-test-data

      - name: Install test dependencies
        shell: bash
        run: |
          echo "Installing test dependencies..."
          # Avoid GNU make on Windows; call uv directly
          uv sync --active --all-groups --all-extras --no-install-package nautilus_trader

      - name: Debug - Check Python and pytest availability
        shell: bash
        run: |
          echo "=== Debug Information ==="
          echo "Python location:"
          which python || echo "python not found in PATH"
          python --version || echo "python command failed"

          echo ""
          echo "Python3 location:"
          which python3 || echo "python3 not found in PATH"
          python3 --version || echo "python3 command failed"

          echo ""
          echo "UV Python location:"
          uv python find || echo "uv python find failed"

          echo ""
          echo "Checking pytest installation:"
          uv run python -c "import pytest; print(f'pytest version: {pytest.__version__}')" || echo "pytest import failed"

          echo ""
          echo "UV pip list (first 20 lines):"
          uv pip list | head -20 || echo "uv pip list failed"

          echo ""
          echo "Current directory:"
          pwd

          echo ""
          echo "Test directory exists:"
          ls -la tests/ | head -10 || echo "tests directory not found"

      - name: Test Python without uv first
        shell: bash
        run: |
          echo "=== Testing Python WITHOUT uv first ==="
          echo ""
          echo "1. Direct Python version:"
          python --version
          echo ""
          echo "2. Find where nautilus_trader wheel was installed:"
          find . -name "nautilus_trader*.whl" -type f 2>/dev/null | head -5 || echo "No wheel found"
          echo ""
          echo "3. Check if we can activate the uv venv manually:"
          if [ -d ".venv" ]; then
            echo "Found .venv directory"
            if [ -f ".venv/Scripts/activate" ]; then
              echo "Activating venv (Windows style)..."
              source .venv/Scripts/activate || echo "Failed to activate"
              echo "Python after activation: $(which python)"
              python --version
              echo "Testing import in activated venv:"
              python -c "import sys; print(f'sys.executable: {sys.executable}')" || echo "Failed"
              python -c "import nautilus_trader; print('SUCCESS: imported nautilus_trader')" || echo "Failed to import with code $?"
            fi
          else
            echo "No .venv directory found"
          fi
          echo ""
          echo "4. Check uv environment location:"
          uv python find
          echo ""
          echo "5. Try importing with timeout to prevent hang:"
          timeout 10 uv run --no-sync python -c "print('Testing uv run...')" || echo "uv run failed or timed out with code $?"

      - name: Test import step by step
        shell: bash
        continue-on-error: true
        run: |
          echo "=== Testing imports step by step ==="
          echo ""
          echo "Test 1: Simple print with uv"
          timeout 5 uv run --no-sync python -c "print('Hello from Python')" || echo "Failed with code $?"
          echo ""
          echo "Test 2: Import sys"
          timeout 5 uv run --no-sync python -c "import sys; print(f'Python: {sys.version}')" || echo "Failed with code $?"
          echo ""
          echo "Test 3: Import a standard library"
          timeout 5 uv run --no-sync python -c "import json; print('json imported')" || echo "Failed with code $?"
          echo ""
          echo "Test 4: Import numpy (C extension)"
          timeout 5 uv run --no-sync python -c "import numpy; print(f'numpy {numpy.__version__} imported')" || echo "Failed with code $?"
          echo ""
          echo "Test 5: Import pytest"
          timeout 5 uv run --no-sync python -c "import pytest; print(f'pytest {pytest.__version__} imported')" || echo "Failed with code $?"
          echo ""
          echo "Test 6: Import nautilus_trader (may crash here)"
          timeout 5 uv run --no-sync python -c "import nautilus_trader; print('nautilus_trader imported')" || echo "Failed with code $?"

      - name: Try direct wheel installation
        shell: bash
        continue-on-error: true
        run: |
          echo "=== Testing direct wheel installation ==="
          echo ""
          echo "1. Find the built wheel:"
          WHEEL_FILE=$(find dist -name "nautilus_trader*.whl" -type f | head -1)
          echo "Found wheel: $WHEEL_FILE"
          echo ""
          echo "2. Install wheel directly with pip:"
          python -m pip install "$WHEEL_FILE" --force-reinstall || echo "Direct pip install failed with code $?"
          echo ""
          echo "3. Test import after direct installation:"
          python -c "import nautilus_trader; print('SUCCESS: Direct wheel install works')" || echo "Direct import failed with code $?"
          echo ""
          echo "4. Test running pytest directly (not through uv):"
          python -m pip install pytest==7.4.4
          python -m pytest --version || echo "Direct pytest failed with code $?"
          echo ""
          echo "5. Try running a single test directly:"
          timeout 30 python -m pytest tests/unit_tests/config/test_common.py -v -x || echo "Direct test run failed with code $?"

      - name: Debug if uv is the problem
        shell: bash
        continue-on-error: true
        run: |
          echo "=== Testing if uv itself is causing issues ==="
          echo ""
          echo "1. Test uv run with simple command:"
          timeout 5 uv run --no-sync python --version || echo "uv run python --version failed with code $?"
          echo ""
          echo "2. Test uv run with echo:"
          timeout 5 uv run --no-sync echo "Hello World" || echo "uv run echo failed with code $?"
          echo ""
          echo "3. Compare uv python vs system python:"
          echo "System Python: $(python --version)"
          echo "UV Python: $(timeout 5 uv run --no-sync python --version 2>&1 || echo 'UV Python failed')"

